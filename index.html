<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Retail Demand Forecasting Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
    margin:0;
    font-family:Segoe UI, Arial, sans-serif;
    background:#f5f7fb;
}

header{
    background:#142B4A;
    color:white;
    padding:25px;
    text-align:center;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.metric{
    font-size:32px;
    font-weight:bold;
    color:#2864DC;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-top:20px;
}

.form-box{
    background:white;
    padding:25px;
    border-radius:12px;
    margin-top:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

label{
    display:block;
    margin-bottom:5px;
    font-weight:600;
}

input,select{
    width:100%;
    padding:10px;
    border:1px solid #ddd;
    border-radius:6px;
}

button{
    width:100%;
    margin-top:20px;
    padding:12px;
    font-size:16px;
    border:none;
    border-radius:6px;
    background:#2864DC;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#1d4fc2;
}

.result{
    margin-top:20px;
    padding:20px;
    background:#EDF4FF;
    border-radius:10px;
    display:none;
}

.prediction{
    font-size:42px;
    color:#2864DC;
    font-weight:bold;
}

.risk-good{
    color:green;
    font-weight:bold;
}

.risk-bad{
    color:red;
    font-weight:bold;
}

#error{
    color:red;
    margin-top:15px;
}

footer{
    text-align:center;
    padding:20px;
    color:#666;
}

@media(max-width:900px){

    .grid{
        grid-template-columns:1fr;
    }

    .form-grid{
        grid-template-columns:1fr;
    }
}

</style>

</head>

<body>

<header>
<h1>📈 Retail Demand Forecasting System</h1>
<p>Predicting Retail Product Demand to Reduce Stockouts and Improve Sales Performance</p>
<div id="apiStatus">Checking API...</div>
</header>

<div class="container">

<div class="cards">

<div class="card">
<h3>Model Accuracy</h3>
<div class="metric">93%</div>
</div>

<div class="card">
<h3>MAE</h3>
<div class="metric">0.91</div>
</div>

<div class="card">
<h3>RMSE</h3>
<div class="metric">1.27</div>
</div>

<div class="card">
<h3>CV Score</h3>
<div class="metric">91%</div>
</div>

</div>

<div class="grid">

<div class="card">
<h3>Demand Trend</h3>
<canvas id="trendChart"></canvas>
</div>

<div class="card">
<h3>Category Demand</h3>
<canvas id="productChart"></canvas>
</div>

</div>

<div class="form-box">

<h2>Demand Prediction</h2>

<form id="predictionForm">

<div class="form-grid">

<div>
<label>Branch</label>
<select id="Branch">
<option>A</option>
<option>B</option>
<option>C</option>
</select>
</div>

<div>
<label>Product Line</label>
<select id="ProductLine">
<option>Electronic accessories</option>
<option>Fashion accessories</option>
<option>Food and beverages</option>
<option>Health and beauty</option>
<option>Home and lifestyle</option>
<option>Sports and travel</option>
</select>
</div>

<div>
<label>Unit Price</label>
<input type="number" id="UnitPrice" required>
</div>

<div>
<label>Sales</label>
<input type="number" id="Sales" required>
</div>

<div>
<label>Month</label>
<input type="number" id="Month" required>
</div>

<div>
<label>Day</label>
<input type="number" id="Day" required>
</div>

<div>
<label>Day Of Week</label>
<input type="number" id="DayOfWeek" required>
</div>

<div>
<label>Quarter</label>
<input type="number" id="Quarter" required>
</div>

<div>
<label>Week</label>
<input type="number" id="Week" required>
</div>

<div>
<label>Weekend (0 or 1)</label>
<input type="number" id="Weekend" required>
</div>

<div>
<label>Lag 1</label>
<input type="number" id="Lag1" required>
</div>

<div>
<label>Lag 3</label>
<input type="number" id="Lag3" required>
</div>

<div>
<label>Lag 7</label>
<input type="number" id="Lag7" required>
</div>

<div>
<label>Rolling Mean 3</label>
<input type="number" id="RollingMean3" required>
</div>

<div>
<label>Rolling Mean 7</label>
<input type="number" id="RollingMean7" required>
</div>

</div>

<button type="submit">Predict Demand</button>

</form>

<div id="error"></div>

<div id="result" class="result">

<h3>Prediction Result</h3>

<div id="prediction" class="prediction">
0
</div>

<div id="risk"></div>

</div>

</div>

</div>

<footer>
Developed by Cuthbert Tongogara
</footer>

<script>

const API_BASE_URL =
"https://quantity-predictor.onrender.com";

async function checkAPI(){

    try{

        let response =
        await fetch(
            API_BASE_URL + "/health"
        );

        if(response.ok){

            document
            .getElementById("apiStatus")
            .innerHTML =
            "✅ Prediction API Online";

        }

    }catch{

        document
        .getElementById("apiStatus")
        .innerHTML =
        "❌ API Offline";

    }

}

checkAPI();

document
.getElementById("predictionForm")
.addEventListener(
"submit",
async function(e){

e.preventDefault();

const payload = {

"Branch":
document.getElementById("Branch").value,

"Product line":
document.getElementById("ProductLine").value,

"Unit price":
Number(document.getElementById("UnitPrice").value),

"Sales":
Number(document.getElementById("Sales").value),

"Month":
Number(document.getElementById("Month").value),

"Day":
Number(document.getElementById("Day").value),

"DayOfWeek":
Number(document.getElementById("DayOfWeek").value),

"Quarter":
Number(document.getElementById("Quarter").value),

"Week":
Number(document.getElementById("Week").value),

"Weekend":
Number(document.getElementById("Weekend").value),

"Lag_1":
Number(document.getElementById("Lag1").value),

"Lag_3":
Number(document.getElementById("Lag3").value),

"Lag_7":
Number(document.getElementById("Lag7").value),

"Rolling_Mean_3":
Number(document.getElementById("RollingMean3").value),

"Rolling_Mean_7":
Number(document.getElementById("RollingMean7").value)

};

try{

const response =
await fetch(
`${API_BASE_URL}/predict`,
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify(payload)
}
);

const data = await response.json();

if(!response.ok){
throw new Error(data.error);
}

document.getElementById("result")
.style.display="block";

document.getElementById("prediction")
.innerHTML =
data.predicted_quantity;

if(data.stockout_risk === "YES"){

document.getElementById("risk")
.innerHTML =
"<p class='risk-bad'>⚠ High Stockout Risk</p>";

}else{

document.getElementById("risk")
.innerHTML =
"<p class='risk-good'>✅ No Stockout Risk</p>";

}

document.getElementById("error").innerHTML="";

}
catch(err){

document.getElementById("error")
.innerHTML = err.message;

}

});

new Chart(
document.getElementById("trendChart"),
{
type:"line",
data:{
labels:["Jan","Feb","Mar","Apr","May","Jun"],
datasets:[{
label:"Demand",
data:[120,140,180,220,260,300],
borderColor:"#2864DC",
fill:false
}]
}
}
);

new Chart(
document.getElementById("productChart"),
{
type:"bar",
data:{
labels:[
"Electronics",
"Fashion",
"Food",
"Health",
"Home",
"Sports"
],
datasets:[{
label:"Demand",
data:[240,180,320,260,190,150],
backgroundColor:"#2864DC"
}]
}
}
);

</script>

</body>
</html>
